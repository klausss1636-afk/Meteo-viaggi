<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Meteo Viaggio</title>
<style>
html,body{margin:0;background:#071522;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
#boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
</style>
</head>
<body>
<div id="boot">Caricamento Meteo Viaggio…</div>
<script>
(async function(){
  try {
    const original = await fetch('https://raw.githubusercontent.com/klausss1636-afk/Meteo-viaggi/cf0d67a54e0d7c11dea6b85893ddacf5095e323d/index.html', {cache:'no-store'});
    if(!original.ok) throw new Error('Impossibile caricare la versione base');
    let html = await original.text();
    const patch = `<script>
/* Meteo Viaggio iPhone/PWA
   Patch ricerca destinazioni v11.0
   Supporta hotel, ristoranti, negozi, POI, indirizzi, città e paesi.
   Da inserire in index.html DOPO gli script esistenti e PRIMA di </body>.
*/
(function(){
  const input = document.getElementById('tripdest');
  if (input) input.placeholder = 'Hotel, luogo, indirizzo o città';

  async function fetchJSON(url, timeout=12000){
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);
    try{
      const response = await fetch(url, {
        signal: controller.signal,
        headers: {'Accept':'application/json'}
      });
      if(!response.ok) throw new Error('Servizio di ricerca non disponibile');
      return await response.json();
    } finally {
      clearTimeout(timer);
    }
  }

  function resultName(x, fallback){
    if (x.display_name) return x.display_name;
    const a = x.address || {};
    const parts = [
      x.name,
      a.hotel || a.motel || a.hostel || a.restaurant || a.cafe ||
      a.shop || a.attraction || a.amenity || a.tourism,
      a.road,
      a.house_number,
      a.city || a.town || a.village || a.municipality,
      a.province || a.county,
      a.state
    ].filter(Boolean);
    return [...new Set(parts)].join(', ') || fallback;
  }

  async function searchNominatim(query){
    const params = new URLSearchParams({
      format: 'jsonv2',
      q: query,
      limit: '5',
      countrycodes: 'it',
      'accept-language': 'it',
      addressdetails: '1',
      namedetails: '1'
    });

    // Se il GPS è disponibile, preferisce risultati ragionevoli rispetto alla posizione,
    // senza impedire ricerche in altre città.
    if (typeof gpsPoint !== 'undefined' && gpsPoint &&
        Number.isFinite(Number(gpsPoint.lat)) && Number.isFinite(Number(gpsPoint.lon))) {
      const lat = Number(gpsPoint.lat), lon = Number(gpsPoint.lon);
      const dLat = 3.5, dLon = 5.0;
      params.set('viewbox', `${lon-dLon},${lat+dLat},${lon+dLon},${lat-dLat}`);
      params.set('bounded', '0');
    }

    return await fetchJSON(
      'https://nominatim.openstreetmap.org/search?' + params.toString()
    );
  }

  async function searchOpenMeteo(query){
    const data = await fetchJSON(
      'https://geocoding-api.open-meteo.com/v1/search?name=' +
      encodeURIComponent(query) +
      '&count=5&language=it&format=json'
    );
    return (data.results || []).map(x => ({
      lat: x.latitude,
      lon: x.longitude,
      name: [x.name, x.admin2, x.admin1].filter(Boolean).join(', ')
    }));
  }

  geocodeDest = async function(query){
    const q = String(query || '').trim();
    if(!q) throw new Error('Inserisci una destinazione');

    const cleaned = q
      .replace(/\s*,\s*/g, ', ')
      .replace(/([a-zà-ù])([0-9])/gi, '$1 $2')
      .replace(/\s+/g, ' ')
      .trim();

    // 1) Ricerca libera: hotel, ristoranti, negozi, ospedali, centri commerciali,
    //    monumenti, attività, vie, numeri civici, città, ecc.
    try{
      const list = await searchNominatim(cleaned);
      if(list && list.length){
        // Preferisce un risultato nominato/POI quando l'utente inserisce un nome struttura.
        const exact = list.find(x => {
          const n = String(x.name || x.namedetails?.name || '').toLowerCase();
          return n && cleaned.toLowerCase().includes(n);
        }) || list[0];

        return {
          lat: Number(exact.lat),
          lon: Number(exact.lon),
          name: resultName(exact, cleaned)
        };
      }
    } catch(e){}

    // 2) Secondo tentativo più tollerante per indirizzi.
    const simplified = cleaned
      .replace(/\b(hotel|albergo|ristorante|trattoria|pizzeria|bar|centro commerciale)\b/ig, '')
      .replace(/\s+/g, ' ')
      .trim();

    if(simplified && simplified !== cleaned){
      try{
        const list = await searchNominatim(simplified);
        if(list && list[0]){
          return {
            lat: Number(list[0].lat),
            lon: Number(list[0].lon),
            name: resultName(list[0], cleaned)
          };
        }
      } catch(e){}
    }

    // 3) Fallback per città/località.
    try{
      const list = await searchOpenMeteo(cleaned);
      if(list.length) return list[0];
    } catch(e){}

    throw new Error(
      'Destinazione non trovata. Prova con nome struttura + città, ad esempio “Hotel Cascina Marisa Opera”.'
    );
  };

  // Aggiorna il testo di stato per chiarire che accetta anche strutture/POI.
  const tripBox = document.querySelector('.tripbox');
  if (tripBox && !document.getElementById('poiSearchHint')){
    const hint = document.createElement('div');
    hint.id = 'poiSearchHint';
    hint.className = 'sub';
    hint.style.marginTop = '6px';
    hint.textContent = 'Puoi cercare hotel, ristoranti, attività, luoghi, vie e città.';
    const search = tripBox.querySelector('.search');
    if (search) search.insertAdjacentElement('afterend', hint);
  }

  const sub = document.querySelector('.brand .sub');
  if (sub) sub.textContent = 'Meteo reale qui e lungo il viaggio · v11.0-ricerca-luoghi';
})();
<\/script>`;
    if (html.includes('</body>')) html = html.replace('</body>', patch + '\n</body>');
    else html += patch;
    document.open();
    document.write(html);
    document.close();
  } catch(e) {
    document.getElementById('boot').innerHTML =
      '<div><h2>Meteo Viaggio</h2><p>Errore di caricamento.</p><p>Controlla la connessione e riprova.</p></div>';
  }
})();
</script>
</body>
</html>
